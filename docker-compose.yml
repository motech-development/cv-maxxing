services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvmaxxing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvmaxxing"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cvmaxxing
      CODEX_MODEL: ${CODEX_MODEL:-}
      CHROMIUM_PATH: ${CHROMIUM_PATH:-/usr/bin/chromium}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - codex_auth:/root/.codex

volumes:
  pg_data:
  codex_auth:
