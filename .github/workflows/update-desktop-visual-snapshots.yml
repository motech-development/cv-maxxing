name: Update Desktop Visual Snapshots

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to update
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read

jobs:
  update-desktop-visual-snapshots:
    name: Update Desktop Visual Snapshots
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Resolve pull request metadata
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_metadata="$(
            gh pr view "${{ inputs.pr_number }}" \
              --repo "${{ github.repository }}" \
              --json headRefName,headRefOid,headRepository,headRepositoryOwner
          )"

          {
            echo "head_repository_name=$(echo "${pr_metadata}" | jq --raw-output '.headRepository.name')"
            echo "head_repository_owner=$(echo "${pr_metadata}" | jq --raw-output '.headRepositoryOwner.login')"
            echo "head_ref_name=$(echo "${pr_metadata}" | jq --raw-output '.headRefName')"
            echo "head_ref_oid=$(echo "${pr_metadata}" | jq --raw-output '.headRefOid')"
          } >> "${GITHUB_OUTPUT}"

      - name: Refuse fork pull requests
        run: |
          if [[ "${{ steps.pull-request.outputs.head_repository_owner }}" != "${{ github.repository_owner }}" ]]; then
            echo "::error::Refusing to update snapshots for fork pull request #${{ inputs.pr_number }}."
            exit 1
          fi

          if [[ "${{ steps.pull-request.outputs.head_repository_name }}" != "${{ github.event.repository.name }}" ]]; then
            echo "::error::Refusing to update snapshots for fork pull request #${{ inputs.pr_number }}."
            exit 1
          fi

      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.pull-request.outputs.head_ref_name }}
          repository: ${{ github.repository }}
          token: ${{ github.token }}

      - name: Verify checked out head SHA
        run: |
          checked_out_sha="$(git rev-parse HEAD)"

          if [[ "${checked_out_sha}" != "${{ steps.pull-request.outputs.head_ref_oid }}" ]]; then
            echo "::error::Checked out ${checked_out_sha}, expected ${{ steps.pull-request.outputs.head_ref_oid }}."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop visual snapshot update
        env:
          CI: 'true'
        run: pnpm --filter @cv-maxxing/desktop test:visual:update

      - name: Commit desktop visual snapshot updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- 'apps/desktop/tests/e2e/*-snapshots/*.png'

          if git diff --cached --quiet --exit-code; then
            echo "No desktop visual snapshot updates to commit."
            exit 0
          fi

          unexpected_staged_paths="$(
            git diff --cached --name-only |
              grep --invert-match --extended-regexp '^apps/desktop/tests/e2e/[^/]+-snapshots/[^/]+\.png$' || true
          )"

          if [[ -n "${unexpected_staged_paths}" ]]; then
            echo "::error::Refusing to commit non-snapshot files."
            echo "${unexpected_staged_paths}"
            exit 1
          fi

          git commit -m "test(desktop): update visual snapshots"
          git push origin "HEAD:${{ steps.pull-request.outputs.head_ref_name }}"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: desktop-visual-snapshot-updater-playwright-artifacts
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
