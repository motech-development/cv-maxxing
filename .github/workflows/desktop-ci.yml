name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  desktop:
    name: Desktop Verification
    runs-on: macos-13
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check desktop app
        run: pnpm --filter @cv-maxxing/desktop typecheck

      - name: Run unit tests
        run: pnpm --filter @cv-maxxing/desktop test:unit

      - name: Run integration tests
        run: pnpm --filter @cv-maxxing/desktop test:integration

      - name: Verify production build
        run: pnpm --filter @cv-maxxing/desktop build

      - name: Run Electron smoke suite
        env:
          CI: 'true'
        run: pnpm --filter @cv-maxxing/desktop smoke

      - name: Run Electron visual regressions
        env:
          CI: 'true'
        run: pnpm --filter @cv-maxxing/desktop test:visual

      - name: Verify macOS Intel package
        run: pnpm --filter @cv-maxxing/desktop package:mac

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-artifacts
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results

      - name: Upload packaged app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: desktop-package
          path: apps/desktop/release
